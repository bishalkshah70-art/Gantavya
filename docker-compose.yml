services:
  postgres:
    image: postgres:17-alpine
    container_name: gantavya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gantavya
      POSTGRES_USER: gantavya
      POSTGRES_PASSWORD: gantavya_dev_password
    ports:
      - "5432:5432"
    volumes:
      - gantavya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gantavya -d gantavya"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gantavya_pgdata:
